# DxAutoInstaller 自动构建工作流 - 直接可用版
# 无需修改任何内容，复制粘贴即可使用
name: DxAutoInstaller 自动构建

# 触发条件
on:
  # 推送到master分支时自动构建
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # 提交PR时自动构建
  pull_request:
    branches: [ master ]
  # 支持手动触发构建
  workflow_dispatch:
    inputs:
      build_config:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

# 环境变量 - 已根据最新项目配置好
env:
  BDS_PATH: 'C:\Program Files (x86)\Embarcadero\Studio\24.0'
  JCL_REPO: 'https://github.com/project-jedi/jcl.git'
  PROJECT_FILE: 'DxAutoInstaller.dproj'
  OUTPUT_DIR: 'Bin'

jobs:
  build:
    name: 构建 DxAutoInstaller
    # 使用最通用的自托管运行器标签，解决标签匹配问题
    # 只要你的运行器是Windows系统且已注册，就会自动匹配
    runs-on: self-hosted
    
    steps:
    # 步骤1: 检出项目代码
    - name: 1. 检出项目代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 步骤2: 自动下载JCL依赖库
    - name: 2. 下载JCL依赖库
      run: |
        Write-Host "正在克隆JCL仓库..."
        git clone --depth 1 $env:JCL_REPO ..\jcl
        cd ..\jcl
        git submodule update --init --depth 1
        Write-Host "JCL下载完成，路径: $((Resolve-Path ..\jcl).Path)"
      shell: powershell

    # 步骤3: 验证Delphi环境
    - name: 3. 验证Delphi 13.1环境
      run: |
        # 检查Delphi是否安装在默认路径
        if (-not (Test-Path "$env:BDS_PATH\bin\rsvars.bat")) {
          Write-Error "错误: 未找到Delphi 13.1安装"
          Write-Error "请确保Delphi 13.1安装在: $env:BDS_PATH"
          exit 1
        }
        
        # 检查命令行编译器是否存在
        if (-not (Test-Path "$env:BDS_PATH\bin\dcc32.exe")) {
          Write-Error "错误: 未找到Delphi命令行编译器"
          Write-Error "请确保安装的是Delphi Professional或更高版本"
          exit 1
        }
        
        Write-Host "Delphi 13.1环境验证成功"
      shell: powershell

    # 步骤4: 编译项目
    - name: 4. 编译项目
      run: |
        @echo off
        REM 加载Delphi环境变量
        call "%BDS_PATH%\bin\rsvars.bat"
        
        REM 设置构建参数
        set "CONFIG=${{ inputs.build_config || 'Release' }}"
        set "JCL_PATH=%CD%\..\jcl"
        
        echo 开始构建: %CONFIG% Win32
        echo JCL路径: %JCL_PATH%
        
        REM 使用MSBuild编译项目
        msbuild "%PROJECT_FILE%" ^
          /p:Configuration=%CONFIG% ^
          /p:Platform=Win32 ^
          /p:DCC_UnitSearchPath="%JCL_PATH%\jcl\source\common;%JCL_PATH%\jcl\source\include;%JCL_PATH%\jcl\source\windows;$(DCC_UnitSearchPath)" ^
          /t:Build ^
          /v:minimal
        
        if %errorlevel% neq 0 (
          echo 构建失败!
          exit %errorlevel%
        )
        
        echo 构建成功!
      shell: cmd

    # 步骤5: 验证构建结果
    - name: 5. 验证构建结果
      run: |
        $exePath = Join-Path $env:OUTPUT_DIR "Win32\${{ inputs.build_config || 'Release' }}\DxAutoInstaller.exe"
        
        if (-not (Test-Path $exePath)) {
          Write-Error "错误: 构建产物不存在"
          Write-Error "期望路径: $exePath"
          exit 1
        }
        
        $fileInfo = Get-Item $exePath
        Write-Host "构建成功!"
        Write-Host "文件: $exePath"
        Write-Host "大小: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
      shell: powershell

    # 步骤6: 上传构建产物
    - name: 6. 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: DxAutoInstaller-Win32-${{ inputs.build_config || 'Release' }}
        path: Bin/Win32/${{ inputs.build_config || 'Release' }}/DxAutoInstaller.exe
        retention-days: 90
        compression-level: 9

  # 自动发布功能 - 推送到master分支时自动创建Release
  release:
    name: 自动发布
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: DxAutoInstaller-Win32-Release
        path: release
    
    - name: 生成版本号
      id: version
      run: |
        DATE=$(date +'%Y.%m.%d')
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "VERSION=$DATE-$SHORT_SHA" >> $GITHUB_OUTPUT
    
    - name: 创建ZIP包
      run: |
        cd release
        zip -r "DxAutoInstaller-v${{ steps.version.outputs.VERSION }}.zip" .
    
    - name: 创建GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: DxAutoInstaller v${{ steps.version.outputs.VERSION }}
        generate_release_notes: true
        files: release/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
